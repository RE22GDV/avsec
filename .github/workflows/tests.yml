name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run the test suite
        run: pytest -q
      - name: Smoke-run the CLI
        run: |
          avsec info
          avsec budget --config configs/comparison.yaml > /dev/null
          avsec demo --config configs/smoke.yaml --output runs/ci_demo
          avsec attack --config configs/attack.yaml --output runs/ci_attack
